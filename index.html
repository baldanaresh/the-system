<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYSTEM">
<title>THE SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03060f; --acc:#3ea6ff; --acc2:#8b5cff; --cyan:#8fe0ff; --red:#ff3b4e; --gold:#ffc857; --green:#4dffb0;
  --text:#d9eaff; --dim:#7f95b8; --panel:rgba(7,14,32,.66); --line:rgba(62,166,255,.38);
  --fh:'Orbitron','Rajdhani','Segoe UI',system-ui,sans-serif;
  --fb:'Rajdhani','Segoe UI',system-ui,-apple-system,sans-serif;
  --fm:'Share Tech Mono',ui-monospace,Consolas,monospace;
  --navw:78px; --toph:58px;
}
body.penalty{--acc:#ff3b4e; --acc2:#ff8a3b; --cyan:#ffb39a; --line:rgba(255,59,78,.45); --panel:rgba(30,6,8,.66)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(62,166,255,.3);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
#fallbackBg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,#12306b 0%,#071230 34%,#03060f 72%);transition:background 1.2s}
body.penalty #fallbackBg{background:radial-gradient(ellipse at 50% 38%,#6b1a12 0%,#300a07 34%,#0f0303 72%)}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%);z-index:1}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;z-index:2;display:grid;grid-template-columns:var(--navw) minmax(0,1fr);grid-template-rows:var(--toph) minmax(0,1fr)}
#top,#nav,#view{min-width:0;min-height:0}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(3,8,20,.9),rgba(3,8,20,.55));backdrop-filter:blur(8px)}
.logo{font-family:var(--fh);font-weight:900;letter-spacing:.28em;font-size:15px;color:var(--cyan);text-shadow:0 0 14px var(--acc);white-space:nowrap}
.logo small{display:block;font-size:8px;letter-spacing:.4em;color:var(--dim);font-weight:500}
#hud{display:flex;align-items:center;gap:14px;flex:1;min-width:0;overflow:hidden;padding:8px 0}
.hud-rank{font-family:var(--fh);font-weight:900;font-size:22px;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--acc);color:var(--cyan);text-shadow:0 0 10px var(--acc);box-shadow:0 0 12px rgba(62,166,255,.35),inset 0 0 12px rgba(62,166,255,.2);transform:rotate(45deg);flex:none;margin:0 6px}
.hud-rank b{transform:rotate(-45deg);font-size:15px}
.hud-xp{flex:1;min-width:60px;max-width:420px}
.hud-xp .lbl{display:flex;justify-content:space-between;font-family:var(--fm);font-size:11px;color:var(--dim);margin-bottom:3px;white-space:nowrap;gap:8px}
.hud-chip{font-family:var(--fm);font-size:13px;white-space:nowrap;padding:4px 9px;border:1px solid var(--line);background:rgba(10,20,45,.5)}
.hud-chip b{color:var(--cyan)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(10,20,45,.5);cursor:pointer;font-size:16px;flex:none}
.iconbtn:hover{border-color:var(--acc);box-shadow:0 0 12px var(--line)}
#nav{display:flex;flex-direction:column;gap:4px;padding:10px 6px;border-right:1px solid var(--line);background:linear-gradient(90deg,rgba(3,8,20,.85),rgba(3,8,20,.4));overflow-y:auto}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border:1px solid transparent;background:none;cursor:pointer;color:var(--dim);font-family:var(--fh);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;position:relative;flex:none}
.nav-i .ic{font-size:19px;line-height:1.1;font-family:var(--fb)}
.nav-i:hover{color:var(--text)}
.nav-i.on{color:var(--cyan);border-color:var(--line);background:rgba(62,166,255,.1);text-shadow:0 0 10px var(--acc)}
.nav-i.on::before{content:"";position:absolute;left:-7px;top:20%;bottom:20%;width:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.nav-i.alert{color:var(--red);animation:pulse 1.1s infinite}
.nav-i kbd{position:absolute;top:2px;right:4px;font-family:var(--fm);font-size:8px;opacity:.45}
#view{overflow-y:auto;overflow-x:hidden;padding:18px;position:relative}
.vwrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ---------- holographic window ---------- */
.win{position:relative;background:var(--panel);border:1px solid var(--line);box-shadow:0 0 22px rgba(62,166,255,.13),inset 0 0 34px rgba(62,166,255,.06);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);padding:16px;animation:flick .55s both}
body.penalty .win{box-shadow:0 0 22px rgba(255,59,78,.18),inset 0 0 34px rgba(255,59,78,.07)}
body.lowq .win,body.lowq #top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(6,12,28,.88)}
.win::before{content:"";position:absolute;inset:-2px;pointer-events:none;
  background:
   linear-gradient(var(--acc),var(--acc)) left top/16px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) left top/2px 16px no-repeat,
   linear-gradient(var(--acc),var(--acc)) right top/16px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) right top/2px 16px no-repeat,
   linear-gradient(var(--acc),var(--acc)) left bottom/16px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) left bottom/2px 16px no-repeat,
   linear-gradient(var(--acc),var(--acc)) right bottom/16px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) right bottom/2px 16px no-repeat;
  filter:drop-shadow(0 0 4px var(--acc))}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(140,200,255,.045) 0 1px,transparent 1px 3px),linear-gradient(180deg,transparent 0,rgba(140,210,255,.07) 50%,transparent 100%);
  background-size:100% 3px,100% 180px;background-repeat:repeat,no-repeat;animation:scan 6s linear infinite}
.win>*{position:relative;z-index:1}
.win-h{font-family:var(--fh);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--cyan);text-shadow:0 0 10px var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-transform:uppercase}
.win-h::before{content:"[";color:var(--acc)}.win-h .t::after{content:"]";color:var(--acc);margin-left:10px}
.win-h .t{display:inline-flex}
@keyframes flick{0%{opacity:0;transform:scaleY(.02) scaleX(.6);filter:brightness(3)}35%{opacity:1;transform:scaleY(1.02) scaleX(1)}45%{opacity:.35}55%{opacity:1}65%{opacity:.6}100%{opacity:1;transform:none;filter:none}}
@keyframes scan{0%{background-position:0 0,0 -180px}100%{background-position:0 0,0 900px}}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin .9s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--line)}50%{box-shadow:0 0 22px var(--acc)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
.shake{animation:shake .45s}
body.rm *{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}

/* ---------- primitives ---------- */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px;min-width:0}.sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.dim{color:var(--dim)}.mono{font-family:var(--fm)}.acc{color:var(--cyan)}.redt{color:var(--red)}.goldt{color:var(--gold)}.greent{color:var(--green)}.sm{font-size:13px}.xs{font-size:11.5px}
.big{font-family:var(--fh);font-weight:900;font-size:34px;line-height:1;color:var(--cyan);text-shadow:0 0 18px var(--acc)}
h3.hh{font-family:var(--fh);font-size:12px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:4px 0 8px}
.btn{font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);background:rgba(62,166,255,.08);color:var(--cyan);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(62,166,255,.22);box-shadow:0 0 16px var(--line);border-color:var(--acc)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,rgba(62,166,255,.45),rgba(62,100,255,.25));color:#fff;border-color:var(--acc);text-shadow:0 0 8px #fff}
body.penalty .btn.pri{background:linear-gradient(180deg,rgba(255,59,78,.5),rgba(180,30,40,.3))}
.btn.red{color:var(--red);border-color:rgba(255,59,78,.5);background:rgba(255,59,78,.08)}
.btn.s{padding:5px 9px;font-size:9.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.tag{font-family:var(--fm);font-size:11px;padding:2px 7px;border:1px solid var(--line);color:var(--cyan);white-space:nowrap;display:inline-block}
.tag.red{color:var(--red);border-color:rgba(255,59,78,.5)}.tag.gold{color:var(--gold);border-color:rgba(255,200,87,.5)}.tag.vio{color:#bfa5ff;border-color:rgba(139,92,255,.55)}.tag.green{color:var(--green);border-color:rgba(77,255,176,.45)}
.bar{height:9px;background:rgba(120,160,220,.12);border:1px solid rgba(120,160,220,.22);position:relative;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc),var(--cyan));box-shadow:0 0 12px var(--acc);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.hp>i{background:linear-gradient(90deg,#ff3b4e,#ff9a3b,#4dffb0)}
.bar.boss{height:14px}.bar.boss>i{background:linear-gradient(90deg,#7a0f1c,#ff3b4e);box-shadow:0 0 12px #ff3b4e}
.bar.gold>i{background:linear-gradient(90deg,#b5791a,var(--gold));box-shadow:0 0 12px var(--gold)}
.bar.thin{height:5px}
input[type=text],input[type=number],input[type=url],input[type=date],select,textarea{width:100%;background:rgba(4,10,24,.7);border:1px solid var(--line);padding:9px 10px;outline:none;font-family:var(--fb);font-size:15px;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 12px var(--line)}
select option{background:#071226}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--fh);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form .full{grid-column:1/3}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.btn.on{background:rgba(62,166,255,.3);color:#fff;border-color:var(--acc);box-shadow:0 0 14px var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--fh);font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(120,160,220,.1);vertical-align:top}
.tblwrap{overflow-x:auto}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed rgba(120,160,220,.25)}

/* ---------- hub ---------- */
.hub{display:grid;grid-template-columns:minmax(300px,370px) 1fr minmax(300px,370px);gap:16px;min-height:calc(100vh - var(--toph) - 36px);align-items:start;max-width:none}
.hub-mid{align-self:end;display:flex;justify-content:center;pointer-events:none;padding-bottom:6px}
.army-badge{pointer-events:auto;text-align:center;font-family:var(--fh);letter-spacing:.3em;font-size:11px;color:var(--dim);padding:8px 18px;background:rgba(3,8,20,.5);border:1px solid var(--line)}
.army-badge b{display:block;font-size:26px;color:#c9b5ff;text-shadow:0 0 16px var(--acc2);letter-spacing:.1em}
.pname{font-family:var(--fh);font-weight:900;font-size:22px;letter-spacing:.06em;word-break:break-word}
.ptitle{font-family:var(--fm);color:var(--gold);font-size:13px;letter-spacing:.08em}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.statbox{text-align:center;border:1px solid rgba(120,160,220,.2);padding:6px 2px;background:rgba(4,10,24,.4)}
.statbox b{display:block;font-family:var(--fh);font-size:17px;color:var(--cyan)}.statbox span{font-family:var(--fm);font-size:10px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;font-family:var(--fm);font-size:12px;color:var(--dim);margin:8px 0 3px}
.kv b{color:var(--text);font-weight:400}
canvas.radar{width:100%;max-width:300px;height:auto;aspect-ratio:1;display:block;margin:6px auto 0}

/* ---------- quests ---------- */
.quest{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid rgba(120,160,220,.18);background:rgba(4,10,24,.45);transition:.2s}
.quest+.quest{margin-top:8px}
.quest:hover{border-color:var(--line)}
.quest.done{opacity:.55}.quest.done .qt{text-decoration:line-through}
.chk{width:26px;height:26px;border:2px solid var(--acc);flex:none;display:grid;place-items:center;cursor:pointer;background:none;color:transparent;font-size:16px;font-weight:700;transition:.15s;margin-top:2px}
.chk:hover:not(:disabled){box-shadow:0 0 14px var(--acc);background:rgba(62,166,255,.15)}
.chk.on{background:var(--acc);color:#02101f;box-shadow:0 0 14px var(--acc);cursor:default}
.qt{font-weight:700;font-size:17px;letter-spacing:.02em}.qd{color:var(--dim);font-size:14px;line-height:1.35}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.warnline{font-family:var(--fm);font-size:12.5px;color:var(--red);border:1px solid rgba(255,59,78,.35);padding:8px 10px;background:rgba(255,59,78,.06);margin-top:12px}
.count{font-family:var(--fm);font-size:15px;color:var(--cyan)}
.pz-count{font-family:var(--fh);font-weight:900;font-size:clamp(40px,9vw,84px);color:var(--red);text-shadow:0 0 30px var(--red);letter-spacing:.06em;text-align:center}

/* ---------- bosses / tower ---------- */
.boss{display:flex;flex-direction:column;gap:10px}
.boss .bn{font-family:var(--fh);font-weight:900;font-size:17px;letter-spacing:.08em}
.boss.dead{opacity:.6}.boss.dead .bn{text-decoration:line-through;color:var(--dim)}
.boss-sig{font-size:44px;line-height:1;filter:drop-shadow(0 0 12px var(--red))}
.task{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.task.on{color:var(--dim);text-decoration:line-through}
.floor{border-left:3px solid var(--acc)}
.floor.locked{opacity:.5;border-left-color:#445}.floor.cleared{border-left-color:var(--gold)}
.fnum{font-family:var(--fh);font-weight:900;font-size:42px;color:rgba(140,200,255,.25);line-height:1}
.cond{margin:7px 0}.cond .kv{margin:0 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--fm);font-size:11.5px;padding:3px 8px;border:1px solid rgba(120,160,220,.25);color:var(--dim);cursor:pointer;background:none}
.chip.av{color:var(--text);border-color:var(--line)}.chip.ms{color:#02101f;background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px var(--line)}
.chip.sel{outline:2px solid var(--gold)}

/* ---------- skills ---------- */
.skills{display:grid;grid-template-columns:1fr 340px;gap:16px}
#skillCv{width:100%;height:min(72vh,720px);display:block;cursor:pointer;touch-action:manipulation}

/* ---------- trackers ---------- */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.hcell{padding:8px;border:1px solid rgba(120,160,220,.2);font-size:13px;cursor:pointer;background:rgba(4,10,24,.4)}
.hcell b{display:block;font-family:var(--fm);font-size:15px}.hcell.sel{outline:2px solid var(--gold)}
.pcard{border:1px solid rgba(120,160,220,.2);padding:12px;background:rgba(4,10,24,.4)}

/* ---------- pipeline ---------- */
.kan{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:rgba(4,10,24,.5);border:1px solid rgba(120,160,220,.2);padding:8px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.kcol.over{border-color:var(--acc);box-shadow:inset 0 0 22px var(--line)}
.kcol h4{font-family:var(--fh);font-size:10px;letter-spacing:.14em;color:var(--cyan);display:flex;justify-content:space-between;text-transform:uppercase}
.kcard{border:1px solid var(--line);padding:8px;background:rgba(10,22,50,.75);cursor:grab;font-size:14px}
.kcard b{display:block;font-size:15px}
.kcard .row{gap:4px;margin-top:6px}
.climb{position:relative;height:74px;margin:14px 8px 4px}
.climb .track{position:absolute;left:0;right:0;top:30px;height:10px;background:rgba(120,160,220,.12);border:1px solid rgba(120,160,220,.25)}
.climb .fill{position:absolute;left:0;top:30px;height:10px;background:linear-gradient(90deg,var(--acc2),var(--acc),var(--gold));box-shadow:0 0 14px var(--acc);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.climb .mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-family:var(--fm);font-size:11px;color:var(--dim);white-space:nowrap}
.climb .mk::after{content:"";position:absolute;left:50%;top:26px;width:1px;height:18px;background:var(--dim)}
.climb .mk.hit{color:var(--gold)}.climb .mk.me{color:var(--cyan);top:46px}.climb .mk.me::after{top:-18px;background:var(--cyan)}
.climb .mk.ghost{color:#bfa5ff;top:46px}.climb .mk.ghost::after{top:-18px;background:#bfa5ff}

/* ---------- analytics ---------- */
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#050b1c}
.ring>div{position:relative;z-index:1;text-align:center}
.cal{display:grid;grid-auto-flow:column;grid-auto-columns:13px;justify-content:start;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.cal i{width:13px;height:13px;background:rgba(120,160,220,.1);display:block}
.cal i.c1{background:rgba(62,166,255,.35)}.cal i.c2{background:var(--acc);box-shadow:0 0 6px var(--acc)}.cal i.cm{background:rgba(255,59,78,.75)}.cal i.cf{background:rgba(139,92,255,.7)}.cal i.ct{outline:1px solid #fff}.cal i.cx{opacity:.25}
canvas.chart{width:100%;height:220px;display:block}

/* ---------- titles ---------- */
.ach{padding:12px;border:1px solid rgba(120,160,220,.2);background:rgba(4,10,24,.45)}
.ach.un{border-color:rgba(255,200,87,.5);box-shadow:inset 0 0 22px rgba(255,200,87,.07)}
.ach.lock{opacity:.45}.ach b{font-family:var(--fh);font-size:13px;letter-spacing:.08em;display:block;margin-bottom:3px}
.ach.un b{color:var(--gold);text-shadow:0 0 10px rgba(255,200,87,.5)}

/* ---------- overlays ---------- */
#toasts{position:fixed;top:calc(var(--toph) + 12px);right:14px;z-index:60;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 28px));pointer-events:none}
.toast{pointer-events:auto;cursor:pointer;padding:12px 14px}
.toast .tt{font-family:var(--fh);font-size:11.5px;letter-spacing:.2em;color:var(--cyan);text-shadow:0 0 10px var(--acc);margin-bottom:4px}
.toast.reward .tt{color:var(--gold);text-shadow:0 0 10px var(--gold)}.toast.warn{border-color:rgba(255,59,78,.6)}.toast.warn .tt{color:var(--red);text-shadow:0 0 10px var(--red)}
.toast .tl{font-family:var(--fm);font-size:13px;line-height:1.45;min-height:1.4em;white-space:pre-wrap}
#modal{position:fixed;inset:0;z-index:70;background:rgba(1,4,12,.72);display:grid;place-items:center;padding:14px;overflow-y:auto}
.modal-win{width:min(600px,100%);max-height:calc(100vh - 28px);overflow-y:auto}
#cine{position:fixed;inset:0;z-index:80;display:grid;place-items:center;text-align:center;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(3,8,24,.35),rgba(1,3,10,.88));padding:20px;overflow:hidden}
#cine.red{background:radial-gradient(ellipse at center,rgba(60,4,8,.45),rgba(12,1,2,.92))}
#cine.arise{background:radial-gradient(ellipse at center,transparent 35%,rgba(1,3,10,.75));align-items:start;padding-top:10vh}
#app{transition:opacity .45s}body.hide-ui #app,body.hide-ui #timer,body.hide-ui #toasts{opacity:0;pointer-events:none}
#view.still .win{animation:none}
.c-big{font-family:var(--fh);font-weight:900;font-size:clamp(40px,11vw,128px);letter-spacing:.12em;line-height:1;color:#fff;text-shadow:0 0 20px var(--cyan),0 0 60px var(--acc),0 0 120px var(--acc2)}
.c-big.gold{text-shadow:0 0 20px #fff3c4,0 0 60px var(--gold),0 0 120px #ff8a00}
.c-big.red{text-shadow:0 0 20px #ffb3b3,0 0 60px var(--red),0 0 120px #a00}
.c-big.vio{text-shadow:0 0 20px #e2d6ff,0 0 60px var(--acc2),0 0 120px #4a1dff}
.c-sub{font-family:var(--fh);font-size:clamp(12px,2.6vw,20px);letter-spacing:.42em;color:var(--cyan);margin-top:18px;text-transform:uppercase}
.c-line{font-family:var(--fm);font-size:clamp(14px,2.4vw,19px);color:var(--text);margin-top:10px;line-height:1.5}
.c-rank{font-family:var(--fh);font-weight:900;font-size:clamp(90px,24vw,240px);line-height:1;color:#fff;text-shadow:0 0 30px var(--gold),0 0 90px #ff8a00}
.c-box{max-width:720px;width:100%}
.c-skip{position:absolute;bottom:18px;left:0;right:0;font-family:var(--fm);font-size:11px;color:var(--dim);letter-spacing:.2em}
.c-hpbar{width:min(520px,80vw);margin:22px auto 0}
#awaken{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at center,rgba(3,8,24,.25),rgba(1,3,10,.9))}
.aw-win{width:min(620px,100%);padding:26px}
.aw-text{font-family:var(--fm);font-size:clamp(15px,2.6vw,19px);line-height:1.6;min-height:5.2em;white-space:pre-wrap}
.aw-text::after{content:"▮";animation:pulse .8s infinite;color:var(--acc);margin-left:2px}
.aw-ctl{margin-top:18px;display:flex;flex-direction:column;gap:12px}
#timer{position:fixed;right:14px;bottom:14px;z-index:55;width:270px;padding:12px}
#timer .tm{font-family:var(--fh);font-weight:900;font-size:40px;text-align:center;color:var(--cyan);text-shadow:0 0 18px var(--acc);letter-spacing:.06em}
#timer .tq{font-size:13px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer.brk .tm{color:var(--green);text-shadow:0 0 18px var(--green)}
kbd.k{font-family:var(--fm);border:1px solid var(--line);padding:1px 6px;font-size:12px;color:var(--cyan)}

/* ---------- responsive ---------- */
@media (max-width:1100px){.hub{grid-template-columns:1fr 1fr}.hub-mid{grid-column:1/3;order:3}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.skills{grid-template-columns:1fr}}
@media (max-width:760px){
  :root{--toph:52px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--toph) minmax(0,1fr) 60px}
  #top{grid-column:1;gap:8px;padding:0 10px}
  .logo{font-size:12px;letter-spacing:.18em}.logo small{display:none}
  .hud-chip.opt{display:none}.hud-xp .lbl span:last-child{display:none}#hud{gap:8px}.hud-xp .lbl span{overflow:hidden;text-overflow:ellipsis}
  #nav{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:4px 6px;background:rgba(3,8,20,.92)}
  .nav-i{min-width:62px;padding:6px 2px}.nav-i kbd{display:none}.nav-i.on::before{left:20%;right:20%;top:-5px;bottom:auto;width:auto;height:3px}
  #view{padding:10px}
  .hub,.grid2,.grid3{grid-template-columns:1fr}.hub-mid{grid-column:1;order:0;min-height:34vh}.hub{min-height:0}
  .form{grid-template-columns:1fr}.form .full{grid-column:1}
  #timer{right:8px;left:8px;bottom:68px;width:auto}
  #toasts{top:calc(var(--toph) + 6px);right:8px}
  .win{padding:12px}
  #skillCv{height:56vh}
}
@media (prefers-reduced-motion:reduce){.win{animation:none}.win::after{animation:none}}

<script>
'use strict';
/* =====================================================================
   THE SYSTEM — career progression interface
   SECTION 1 — CONFIG: every balance number lives here. Tune freely.
   ===================================================================== */
const CONFIG = {
  storageKey: 'the-system-save-v1',
  xp: {
    dsa: { easy: 15, medium: 30, hard: 60 },          // per logged problem
    resultMult: { clean: 1, hint: 0.6, fail: 0.3 },   // multiplier by outcome
    quest: { build: 40, review: 20, contest: 80, project: 110, sd: 45, weekly: 30 },
    dailyClear: 50,          // bonus for finishing every daily quest
    penaltyClear: 30,        // surviving the penalty zone
    mistakeQuest: 20,        // spaced-repetition re-solve (clean); half if not clean
    focusSession: 5,         // per finished pomodoro
    focusSessionDailyCap: 8,
    projectMilestone: 150,
    readmeItem: 20,
    mock: 100,
    sdTopic: 40,
    outreach: 10,            // per referral / application message
    skillNode: 60,
    weeklyBoss: 250,
    floorBoss: 600           // multiplied by floor number
  },
  level: { base: 100, growth: 1.15 },                  // XP for level L→L+1 = base * growth^(L-1)
  ranks: [                                             // needs BOTH total XP and best streak
    { id: 'E', name: 'E-Rank', xp: 0, streak: 0 },
    { id: 'D', name: 'D-Rank', xp: 1500, streak: 3 },
    { id: 'C', name: 'C-Rank', xp: 5000, streak: 7 },
    { id: 'B', name: 'B-Rank', xp: 12000, streak: 14 },
    { id: 'A', name: 'A-Rank', xp: 25000, streak: 21 },
    { id: 'S', name: 'S-Rank', xp: 45000, streak: 30 },
    { id: 'N', name: 'National-Level', xp: 80000, streak: 45 }
  ],
  stat: {                                              // stat gains by activity
    dsa: { easy: 0.5, medium: 1, hard: 2 },            // → INT
    dsaFastBonus: 0.5,                                 // → AGI when solved clean under target time
    dsaTargetMin: { easy: 15, medium: 30, hard: 45 },
    dayClearVIT: 1, skillNode: 2, milestone: 1, mock: 1, sdTopic: 1
  },
  penalty: { xpLoss: 80, hpLoss: 25, failHp: 10, maxDaysCharged: 3 },
  energy: { max: 100, dayClear: 8, penaltyClear: 10 },
  freeze: { max: 2 },
  difficulty: {
    easy:   { label: 'Gentle',  xp: 1.25, penalty: 0.5 },
    normal: { label: 'Hunter',  xp: 1.0,  penalty: 1.0 },
    hard:   { label: 'Monarch', xp: 0.85, penalty: 1.5 }
  },
  srsDays: [1, 3, 7, 14],                              // mistake resurfacing schedule
  weekly: { problems: [10, 12], outreach: [5, 10], outreachFromMonth: 3 },
  pomodoro: { focusMin: 25, breakMin: 5 },
  hours: { weekday: 2.5, weekend: 5.5 },               // baseline the quest minutes are scaled from
  salary: { current: 3.8, milestones: [20, 30, 50] },  // LPA
  readiness: { dsaTarget: 200, sdTarget: 15, mockTarget: 10, milestoneTarget: 8 },
  quality: { particles: [1400, 3500, 7000], fpsDown: 38 },
  army: { max: 140 },
  accounts: { codeforces: 'Naresh_304', leetcode: 'Baldanaresh' },   // defaults; editable in Settings
  verify: {
    manualMult: 0.5,          // XP multiplier for hand-logged (unverified) problems while verification is on
    autoSyncMin: 10,          // background sync interval while the app is open
    auditEveryDays: 3,        // how often an old "clean" solve is re-tested
    auditAfterDays: 7,        // minimum age of a solve before it can be audited
    auditClawback: 0.5,       // share of the problem's XP lost when an audit is failed
    cfRating: { medium: 1200, hard: 1700 }   // Codeforces rating → difficulty
  }
};

/* ===================== SECTION 2 — STATIC DATA ===================== */
const STATS = ['INT', 'AGI', 'STR', 'SENSE', 'VIT'];
const STAT_DESC = { INT: 'DSA', AGI: 'Python / speed', STR: 'Backend & design', SENSE: 'GenAI', VIT: 'Consistency' };
const PATTERNS = ['Arrays & Hashing', 'Two Pointers', 'Sliding Window', 'Binary Search', 'Stack / Queue', 'Linked List', 'Trees', 'Heaps', 'Graphs', 'Backtracking', 'Dynamic Programming', 'Greedy', 'Other'];
const FLOOR_PATTERNS = { 1: ['Arrays & Hashing', 'Two Pointers', 'Sliding Window', 'Trees', 'Graphs', 'Dynamic Programming'], 2: PATTERNS.slice(0, 12), 3: PATTERNS.slice(0, 12) };
const BR_ORDER = ['dsa', 'py', 'genai', 'be', 'sd', 'cs'];
const BRANCHES = {
  dsa: { n: 'DSA Patterns', stat: 'INT', col: '#3ea6ff' }, py: { n: 'Python', stat: 'AGI', col: '#4dffb0' },
  genai: { n: 'GenAI Engineering', stat: 'SENSE', col: '#b78bff' }, be: { n: 'Backend', stat: 'STR', col: '#ffb14d' },
  sd: { n: 'System Design', stat: 'STR', col: '#ff6b8b' }, cs: { n: 'CS Fundamentals', stat: 'INT', col: '#7fe0ff' }
};
const SKILLS = [
  { id: 'arrays', n: 'Arrays & Hashing', ab: 'AH', br: 'dsa', d: 1, o: 0, req: [], fl: 1, desc: 'Frequency maps, prefix sums, in-place tricks. Master = 10+ problems solved without hints.' },
  { id: 'twoptr', n: 'Two Pointers', ab: '2P', br: 'dsa', d: 2, o: -1, req: ['arrays'], fl: 1, desc: 'Opposite ends, fast/slow, partitioning. Master = you spot the pattern in under 2 minutes.' },
  { id: 'stack', n: 'Stack / Queue', ab: 'SQ', br: 'dsa', d: 2, o: 0, req: ['arrays'], fl: 1, desc: 'Monotonic stacks, BFS queues, parentheses-style problems.' },
  { id: 'binsearch', n: 'Binary Search', ab: 'BS', br: 'dsa', d: 2, o: 1, req: ['arrays'], fl: 1, desc: 'On arrays and on the answer space. Master = no off-by-one bugs.' },
  { id: 'sliding', n: 'Sliding Window', ab: 'SW', br: 'dsa', d: 3, o: -1, req: ['twoptr'], fl: 1, desc: 'Fixed and variable windows, with hash-map state.' },
  { id: 'trees', n: 'Trees', ab: 'TR', br: 'dsa', d: 3, o: 0, req: ['stack'], fl: 1, desc: 'DFS/BFS traversals, BST properties, LCA, path problems.' },
  { id: 'graphs', n: 'Graphs', ab: 'GR', br: 'dsa', d: 4, o: -1, req: ['trees'], fl: 1, desc: 'BFS/DFS, topological sort, union-find, Dijkstra.' },
  { id: 'heaps', n: 'Heaps', ab: 'HP', br: 'dsa', d: 4, o: 1, req: ['trees'], fl: 2, desc: 'Top-K, two heaps, merge K lists, scheduling.' },
  { id: 'dp', n: 'Dynamic Programming', ab: 'DP', br: 'dsa', d: 5, o: 0, req: ['graphs'], fl: 1, desc: '1D/2D DP, knapsack, LIS, DP on strings. Master = you can define state + transition out loud.' },
  { id: 'pycore', n: 'Python Core', ab: 'PY', br: 'py', d: 1, o: 0, req: [], fl: 1, desc: 'Data structures, comprehensions, functions, modules, error handling.' },
  { id: 'pyoop', n: 'Pythonic OOP', ab: 'OO', br: 'py', d: 2, o: 0, req: ['pycore'], fl: 1, desc: 'Classes, dunder methods, dataclasses, decorators, generators, context managers.' },
  { id: 'pyadv', n: 'Async, Typing & Tests', ab: 'AT', br: 'py', d: 3, o: 0, req: ['pyoop'], fl: 3, desc: 'asyncio, type hints, pytest. Production-grade Python.' },
  { id: 'llm', n: 'LLM Fundamentals', ab: 'LM', br: 'genai', d: 1, o: 0, req: [], fl: 1, desc: 'Tokens, context windows, sampling, transformer intuition, API usage and cost.' },
  { id: 'prompt', n: 'Prompt Engineering', ab: 'PE', br: 'genai', d: 2, o: -1, req: ['llm'], fl: 1, desc: 'System prompts, few-shot, structured output, guardrails.' },
  { id: 'embed', n: 'Embeddings', ab: 'EM', br: 'genai', d: 2, o: 1, req: ['llm'], fl: 1, desc: 'Semantic similarity, chunking strategy, embedding model choice.' },
  { id: 'vdb', n: 'Vector Databases', ab: 'VD', br: 'genai', d: 3, o: 1, req: ['embed'], fl: 1, desc: 'Indexing (HNSW/IVF), metadata filters, hybrid search.' },
  { id: 'rag', n: 'RAG Pipelines', ab: 'RG', br: 'genai', d: 4, o: 0, req: ['vdb', 'prompt'], fl: 1, desc: 'Retrieval, re-ranking, grounding, citations. Master = a working RAG project on GitHub.' },
  { id: 'agents', n: 'LangChain Agents', ab: 'AG', br: 'genai', d: 5, o: -1, req: ['rag'], fl: 2, desc: 'Tool calling, planning loops, memory, failure handling.' },
  { id: 'ragas', n: 'RAGAS Evaluation', ab: 'EV', br: 'genai', d: 5, o: 1, req: ['rag'], fl: 2, desc: 'Faithfulness, answer relevancy, context precision/recall. Master = eval numbers in your README.' },
  { id: 'rest', n: 'REST + FastAPI', ab: 'API', br: 'be', d: 1, o: 0, req: [], fl: 2, desc: 'Resource design, status codes, validation, auth, pagination, FastAPI.' },
  { id: 'dbdesign', n: 'DB Design', ab: 'DB', br: 'be', d: 2, o: -1, req: ['rest'], fl: 2, desc: 'Schema modelling, normalisation, indexes, transactions.' },
  { id: 'docker', n: 'Docker', ab: 'DK', br: 'be', d: 2, o: 1, req: ['rest'], fl: 2, desc: 'Images, multi-stage builds, compose. Master = your project runs with one command.' },
  { id: 'micro', n: 'Microservices', ab: 'MS', br: 'be', d: 3, o: 0, req: ['docker', 'dbdesign'], fl: 2, desc: 'Service boundaries, queues, API gateways, observability.' },
  { id: 'lld', n: 'Low-Level Design', ab: 'LLD', br: 'sd', d: 1, o: 0, req: [], fl: 2, desc: 'SOLID, design patterns, class diagrams. Parking lot, splitwise, rate limiter.' },
  { id: 'hld', n: 'High-Level Design', ab: 'HLD', br: 'sd', d: 2, o: 0, req: ['lld'], fl: 2, desc: 'Requirements, estimation, caching, load balancing, sharding, trade-offs.' },
  { id: 'dist', n: 'Distributed Systems', ab: 'DS', br: 'sd', d: 3, o: 0, req: ['hld'], fl: 3, desc: 'CAP, consensus, replication, consistency models, idempotency.' },
  { id: 'oop', n: 'OOP Concepts', ab: 'OOP', br: 'cs', d: 1, o: 0, req: [], fl: 1, desc: 'Encapsulation, inheritance vs composition, polymorphism — with interview answers.' },
  { id: 'dbms', n: 'DBMS', ab: 'DBM', br: 'cs', d: 2, o: -1, req: ['oop'], fl: 2, desc: 'ACID, isolation levels, joins, indexing internals, SQL fluency.' },
  { id: 'os', n: 'Operating Systems', ab: 'OS', br: 'cs', d: 2, o: 1, req: ['oop'], fl: 2, desc: 'Processes vs threads, scheduling, memory, deadlocks, concurrency.' },
  { id: 'net', n: 'Networks', ab: 'NET', br: 'cs', d: 3, o: 0, req: ['dbms', 'os'], fl: 2, desc: 'TCP/UDP, HTTP/HTTPS, DNS, what happens when you type a URL.' }
];
const SKILL_BY = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const WEEKLY_BOSSES = [
  { id: 'contest', sig: '⚔️', name: 'The Contest Colossus', kind: 'Timed contest', stat: { INT: 2, AGI: 1 }, freeze: false,
    tasks: ['Enter a timed contest (live or virtual) — no pausing', 'Solve at least 2 problems inside the time limit', 'Upsolve 1 problem you could not finish', 'Log every miss in the DSA log so it enters the mistake queue'] },
  { id: 'mock', sig: '👁️', name: 'The Interrogator', kind: 'Mock interview', stat: { INT: 1, STR: 1 }, freeze: true,
    tasks: ['Schedule a mock (peer, Pramp, or a recorded solo session)', 'Complete it while thinking out loud for the full duration', 'Record the score and feedback in the Mock log', 'Write 3 concrete fixes for next time'] },
  { id: 'ship', sig: '⚙️', name: 'The Shipwright Golem', kind: 'Project milestone', stat: { SENSE: 2, STR: 1 }, freeze: false,
    tasks: ['Define one milestone small enough to ship this week', 'Implement it', 'Test it end to end', 'Push to GitHub and update the README'] },
  { id: 'design', sig: '🐉', name: 'The Architect Wyrm', kind: 'System-design write-up', stat: { STR: 3 }, freeze: true,
    tasks: ['Pick one system (URL shortener, rate limiter, chat, feed…)', 'Write requirements and back-of-envelope estimates', 'Draw the high-level design', 'Write up trade-offs, bottlenecks and log it under System Design'] }
];
const PENALTY_TASKS = ['Solve 1 extra problem (or re-solve a past mistake) and log it', 'Do 20 minutes of revision on what you skipped', 'Write one line: why the day was missed, and the fix'];
const README_ITEMS = [{ k: 'arch', n: 'Architecture diagram' }, { k: 'demo', n: 'Demo GIF / video / live link' }, { k: 'eval', n: 'Eval metrics (e.g. RAGAS scores)' }, { k: 'setup', n: 'One-command setup instructions' }, { k: 'design', n: 'Design decisions & trade-offs' }];
const STAGES = [{ id: 'target', n: 'Target' }, { id: 'referral', n: 'Referral asked' }, { id: 'applied', n: 'Applied' }, { id: 'oa', n: 'OA' }, { id: 'interview', n: 'Interviews' }, { id: 'offer', n: 'Offer' }];
const TIERS = ['FAANG-tier', 'Indian product', 'GCC / Finance', 'GenAI startup', 'Other'];
const SEED_COMPANIES = [['Google', 0], ['Amazon', 0], ['Microsoft', 0], ['Flipkart', 1], ['Razorpay', 1], ['PhonePe', 1], ['Swiggy', 1], ['JPMorgan Chase', 2], ['Goldman Sachs', 2], ['Wells Fargo', 2], ['HSBC', 2], ['BlackRock', 2], ['FactSet', 2], ['GenAI startup (rename me)', 3]];
const MOCK_TYPES = ['DSA', 'System Design', 'LLD', 'GenAI / ML', 'Behavioral', 'Full loop'];

/* helpers used by floors / achievements / readiness */
const solvedList = () => state.dsa.filter(d => d.result !== 'fail' && counts(d));
const milestonesDone = () => state.projects.reduce((s, p) => s + p.milestones.filter(m => m.done).length, 0);
const skillsIn = br => SKILLS.filter(s => s.br === br && state.skills[s.id]).length;
const daysCleared = () => Object.values(state.days).filter(d => d.completed).length;
const outreachTotal = () => Object.values(state.outreach).reduce((a, b) => a + b, 0);
const readmeDone = p => README_ITEMS.filter(r => p.readme[r.k]).length;
const mockAvg = n => { const a = state.mocks.slice(-n); return a.length ? a.reduce((s, m) => s + m.score, 0) / a.length : 0; };

const FLOORS = [
  { id: 1, name: 'The Foundation Depths', months: 'Months 1–2', sig: '🗝️', boss: 'Gatekeeper of Foundations', title: 'f1',
    focus: ['Python fundamentals', 'DSA patterns: two pointers, sliding window, trees, graphs, DP', 'Start a RAG project'],
    conds: [
      { n: 'Problems solved', t: 60, v: () => solvedList().length },
      { n: 'DSA pattern nodes mastered', t: 5, v: () => skillsIn('dsa') },
      { n: 'Python Core mastered', t: 1, v: () => state.skills.pycore ? 1 : 0 },
      { n: 'Project milestones shipped (RAG project)', t: 2, v: () => milestonesDone() },
      { n: 'Daily quests cleared', t: 20, v: () => daysCleared() }
    ] },
  { id: 2, name: 'The Systems Stratum', months: 'Months 3–4', sig: '⛓️', boss: 'Warden of Systems', title: 'f2',
    focus: ['RAGAS evaluation', 'LangChain agents', 'FastAPI + Docker', 'LLD / HLD practice', 'Begin mock interviews'],
    conds: [
      { n: 'Problems solved', t: 150, v: () => solvedList().length },
      { n: 'RAGAS + Agents mastered', t: 2, v: () => (state.skills.ragas ? 1 : 0) + (state.skills.agents ? 1 : 0) },
      { n: 'REST/FastAPI + Docker mastered', t: 2, v: () => (state.skills.rest ? 1 : 0) + (state.skills.docker ? 1 : 0) },
      { n: 'System-design topics logged', t: 6, v: () => state.sd.length },
      { n: 'Mock interviews logged', t: 3, v: () => state.mocks.length }
    ] },
  { id: 3, name: 'The Offer Summit', months: 'Months 5–6', sig: '👑', boss: 'Monarch of Offers', title: 'f3',
    focus: ['Polish projects and resume', 'Apply with referrals', 'Continuous mocks'],

/* Called on boot and whenever the date changes. Applies penalties for missed days and assigns today's quest. */

/* ---- canvases ---- */
function fitCanvas(cv) {

}

    ctx.clearRect(0, 0, w, h); ctx.lineWidth = 1;
    for (let g = 1; g <= 4; g++) { ctx.beginPath(); for (let i = 0; i < 5; i++) { const [x, y] = pt(i, R * g / 4); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.closePath(); ctx.strokeStyle = 'rgba(140,190,255,' + (g === 4 ? .45 : .16) + ')'; ctx.stroke(); }
    for (let i = 0; i < 5; i++) { const [x, y] = pt(i, R); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.strokeStyle = 'rgba(140,190,255,.16)'; ctx.stroke(); }
    ctx.beginPath(); STATS.forEach((s, i) => { const [x, y] = pt(i, R * e * clamp(state.stats[s] / maxV, 0.04, 1)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, R); gr.addColorStop(0, 'rgba(139,92,255,.25)'); gr.addColorStop(1, acc + '88');

    ctx.font = '700 12px Orbitron, Rajdhani, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    STATS.forEach((s, i) => { const [x, y] = pt(i, R * e * clamp(state.stats[s] / maxV, 0.04, 1)); ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); const [lx, ly] = pt(i, R + 22); ctx.fillStyle = '#9fd4ff'; ctx.fillText(s, lx, ly); });

  };
  frame();
}
function drawXpChart() {

  const span = clamp(dayDiff(state.startDate || t, t) + 1, 2, 120), pts = []; let cum = 0;
  const before = Object.keys(state.days).filter(k => k < addDays(t, -(span - 1))).reduce((s, k) => s + (state.days[k].xp || 0), 0); cum = before;
  for (let i = span - 1; i >= 0; i--) { const k = addDays(t, -i); cum += (state.days[k] && state.days[k].xp) || 0; pts.push({ k, v: cum, d: (state.days[k] && state.days[k].xp) || 0 }); }

  const mm = String(Math.floor(rem / 6e4)).padStart(2, '0') + ':' + String(Math.floor(rem / 1000) % 60).padStart(2, '0');

    }));

        cls: 'red', dur: 3400, onShow: () => { SFX.play('warn'); FX.shake(0.8); FX.flash('#ff5a5a', 0.45); World.push(0.8); slam('#cS', 3); slam('#cB', 1.6); rise('.cL', 0.7); }, onEnd: () => World.push(0)
      }); done();
    }));
  },
  bossDefeat(name, loot) {
    this.enqueue(() => cineShow(`<div class="c-box"><div class="c-sub goldt">DUNGEON CLEARED</div><div class="c-big gold" id="cB" style="font-size:clamp(26px,6vw,64px)">${name}</div><div class="c-hpbar"><div class="bar boss"><i id="cHp" style="width:25%"></i></div></div><div class="c-line cL redt">HAS BEEN SLAIN</div>${loot.map(l => `<div class="c-line cL">${esc(l)}</div>`).join('')}</div>`, {
      dur: 4200, onShow: () => { SFX.play('defeat'); FX.flash('#ffffff', 0.9); FX.shake(1.2); World.bloomSpike(1.2); World.push(0.9); G.fromTo('#cB', { scale: 1, opacity: 1 }, { scale: 1, opacity: 0.45, duration: 1.2 }); requestAnimationFrame(() => { const h = $('#cHp'); if (h) h.style.width = '0%'; }); rise('.cL', 0.7); }, onEnd: () => World.push(0)
    }));
    this.arise(name);
  },
  floorClear(f, xp) {
    const nx = FLOORS.find(x => x.id === f.id + 1), rn = ['I', 'II', 'III'][f.id - 1];
    this.enqueue(() => cineShow(`<div class="c-box"><div class="c-sub goldt">FLOOR ${rn} CLEARED</div><div class="c-big gold" id="cB" style="font-size:clamp(28px,6.5vw,72px)">${f.boss}</div><div class="c-line cL redt">HAS FALLEN</div><div class="c-line cL">+${xp} XP · all stats +2 · Streak Freeze</div><div class="c-line cL acc">${nx ? 'FLOOR ' + ['I', 'II', 'III'][nx.id - 1] + ' UNLOCKED — ' + nx.name : 'THE TOWER IS CONQUERED'}</div></div>`, {
      dur: 5200, onShow: () => { SFX.play('rankUp'); FX.flash('#ffe9a8', 0.95); FX.shake(1.4); World.bloomSpike(1.5); World.push(1.2); slam('#cB', 3); rise('.cL', 0.8); }, onEnd: () => World.push(0)
    }));
    this.arise(f.boss);
  },
  achievement(a) {
    this.enqueue(() => cineShow(`<div class="c-box"><div class="c-sub goldt">TITLE ACQUIRED</div><div class="c-big gold" id="cB" style="font-size:clamp(24px,5.5vw,60px)">« ${a.n} »</div><div class="c-line cL">${a.d}</div><div class="c-line cL dim">Equip it from the Titles screen.</div></div>`, {
      dur: 2800, onShow: () => { SFX.play('reward'); FX.flash('#ffe9a8', 0.4); World.bloomSpike(0.6); G.fromTo('#cB', { opacity: 0, letterSpacing: '0.8em' }, { opacity: 1, letterSpacing: '0.12em', duration: 0.9, ease: 'power3.out' }); rise('.cL', 0.6); }
    }));
  },
  penaltyEnter(r) {
    if (!r.missed) { this.notify('info', 'STREAK FREEZE CONSUMED', [r.frozen + ' missed day' + (r.frozen > 1 ? 's were' : ' was') + ' absorbed.', 'Your streak of ' + state.streak + ' survives. Do not rely on it.']); return; }
    this.enqueue(() => cineShow(`<div class="c-box"><div class="c-sub redt">[ PENALTY ]</div><div class="c-big red" id="cB" style="font-size:clamp(34px,8vw,92px)">QUEST FAILED</div><div class="c-line cL">Daily Quest not completed — ${r.missed} day${r.missed > 1 ? 's' : ''}.</div><div class="c-line cL redt">Streak ${r.streakLost} → 0 &nbsp;·&nbsp; −${r.xpLost} XP &nbsp;·&nbsp; Energy ${state.hp}/${CONFIG.energy.max}</div>${r.frozen ? `<div class="c-line cL dim">${r.frozen} day(s) absorbed by Streak Freeze.</div>` : ''}<div class="c-line cL">You are being transferred to the Penalty Zone.</div></div>`, {
      cls: 'red', dur: 5200, onShow: () => { SFX.play('warn'); FX.flash('#ff2a2a', 0.7); FX.shake(1.2); slam('#cB', 2.2); rise('.cL', 0.8); }
    }));
  },
  penaltyCleared(xp) { SFX.play('quest'); this.flash('#bfe3ff', 0.6); this.notify('reward', 'PENALTY QUEST CLEARED', ['You survived the Penalty Zone.', '+' + xp + ' XP   VIT +1   Energy +' + CONFIG.energy.penaltyClear, 'Returning to the hub.']); }
};

/* ===================== SECTION 13 — AWAKENING (first run) ===================== */
async function awakening() {
  const el = $('#awaken'); el.classList.remove('hidden');
  el.innerHTML = `<div class="win aw-win"><div class="win-h"><span class="t">SYSTEM</span></div><div class="aw-text" id="awT"></div><div class="aw-ctl" id="awC"></div></div>`;
  const T = $('#awT'), Cc = $('#awC');
  const say = async txt => { Cc.innerHTML = ''; await typeInto(T, txt, 20); };
  const btn = label => new Promise(r => { Cc.innerHTML = `<div class="row"><span class="sp"></span><button class="btn pri" id="awB">${label}</button></div>`; const b = $('#awB'); b.onclick = () => { SFX.unlock(); SFX.play('confirm'); r(); }; b.focus(); });
  const form = html => new Promise(r => { Cc.innerHTML = `<form id="awF" class="form">${html}<div class="full row"><span class="sp"></span><button class="btn pri">CONFIRM</button></div></form>`; const f = $('#awF'); const first = f.querySelector('input'); if (first) first.focus(); f.onsubmit = ev => { ev.preventDefault(); SFX.unlock(); SFX.play('confirm'); const v = {}; new FormData(f).forEach((x, k) => v[k] = String(x).trim()); r(v); }; });

  await say('A dormant signal has been detected.\n\nYou have met the conditions to become a Player.\nWill you accept?');
  await btn('ACCEPT');
  FX.flash('#cfe8ff', 0.6); World.bloomSpike(0.9);
  await say('Registration started.\n\nState your name, Player.');
  const a = await form('<label class="f full">Name<input type="text" name="name" maxlength="24" required autocomplete="off" placeholder="Your name"></label>');
  state.player.name = a.name.slice(0, 24) || 'Player';
  await say(`Welcome, ${state.player.name}.\n\nYour job claims 8 hours a day. The System will take only what remains.\nHow many hours can you give it?`);
  const h = await form(`<label class="f">Weekday hours<input type="number" name="wd" min="0.5" max="8" step="0.5" value="${CONFIG.hours.weekday}" required></label>
    <label class="f">Weekend hours<input type="number" name="we" min="1" max="12" step="0.5" value="${CONFIG.hours.weekend}" required></label>
    <label class="f full">Current CTC (LPA)<input type="number" name="ctc" min="0.1" max="500" step="0.1" value="${CONFIG.salary.current}" required></label>`);
  state.player.hoursWeekday = clamp(+h.wd || CONFIG.hours.weekday, 0.5, 8); state.player.hoursWeekend = clamp(+h.we || CONFIG.hours.weekend, 1, 12); state.player.ctc = clamp(+h.ctc || CONFIG.salary.current, 0.1, 500);
  await say(`Assessment complete.\n\nRank: E\nTitle: The Weakest Hunter\nCurrent worth: ₹${state.player.ctc} LPA\nObjective: ₹${CONFIG.salary.milestones[0]}–${CONFIG.salary.milestones[1]} LPA within 6 months. Stretch: ₹${CONFIG.salary.milestones[2]} LPA.\n\nThe tower has three floors. You will climb all of them.`);
  await btn('CONTINUE');
  await say('Your first Daily Quest has been assigned.\n\nClear it and you grow stronger.\nMiss it and the Penalty Zone awaits.\n\nThat is the only rule.' + (verifyOn() ? '\n\nLinked accounts will be checked. The System does not take your word for it.' : ''));
  await btn('ARISE');
  state.onboarded = true; state.startDate = todayKey(); state.lastDate = null;
  if (!state.jobs.length) SEED_COMPANIES.forEach(([c, t]) => addJob({ company: c, tier: TIERS[t] }));
  FX.flash('#ffffff', 0.9); World.bloomSpike(1.3); FX.shake(0.8); SFX.play('levelUp');
  G.to(el, { opacity: 0, duration: 0.6 }); setTimeout(() => { el.classList.add('hidden'); el.innerHTML = ''; el.style.opacity = ''; }, 650);
  ui.view = 'quests'; boot();
  FX.notify('info', 'DAILY QUEST ASSIGNED', ['Tick objectives as you finish them.', 'Press ? for keyboard shortcuts.']);
}

/* ===================== SECTION 14 — BOOT ===================== */
function afterRollover() {
  weekBosses(); checkAchievements(); save(); render(); renderTimer();
  World.setArmy(armyCount()); World.setPenalty(penaltyActive());
  if (state.penaltyNotice) {
    const r = state.penaltyNotice; state.penaltyNotice = null; save();
    FX.penaltyEnter(r);
    if (penaltyActive()) { ui.view = 'penalty'; render(); }
  }
}
function boot() { $('#app').classList.remove('hidden'); rollover(); afterRollover(); syncAccounts(false); }
function tick() {
  if (!state.onboarded) return;
  tickTimer(); updateCountdowns();
  if (!document.hidden && Date.now() - sync.last > CONFIG.verify.autoSyncMin * 6e4) syncAccounts(false);
  if (state.lastDate && state.lastDate !== todayKey()) { rollover(); afterRollover(); FX.notify('info', 'NEW DAY', ['A new Daily Quest has been assigned.']); }
}
function init() {
  loadState(); applyMotion(); bindUi(); World.init();
  if (mqRM.addEventListener) mqRM.addEventListener('change', applyMotion);
  document.addEventListener('pointerdown', () => SFX.unlock(), { passive: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(tick, 500);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => { });   // installable + offline
  if (state.onboarded) boot(); else awakening();
  /* console helpers for tuning/testing: SYS.shiftDays(1) simulates tomorrow, SYS.xp(500) grants XP */
  window.SYS = { CONFIG, get state() { return state; }, shiftDays(n) { dayShift += n; tick(); return todayKey(); }, xp(n) { gainXp(n); commit(); }, readiness };
}
init();

</script>
